<header class="app-header">
  <div class="header-left">
    <span class="app-name">{{ 'common.appName' | transloco }}</span>
    <app-office-switcher />
  </div>
  <div class="header-right">
    <app-lang-switch />
    <span class="user-name">{{ profile()?.displayName }}</span>
    <button class="btn" type="button" (click)="logout()" [disabled]="loggingOut()">
      {{ 'common.logout' | transloco }}
    </button>
  </div>
</header>

<div class="shell-body">
  <nav class="side-nav" [attr.aria-label]="'nav.label' | transloco">
    <a
      [routerLink]="['/o', officeId()]"
      routerLinkActive="active"
      [routerLinkActiveOptions]="{ exact: true }"
    >
      {{ 'nav.dashboard' | transloco }}
    </a>
    <a [routerLink]="['/o', officeId(), 'employees']" routerLinkActive="active">
      {{ 'nav.employees' | transloco }}
    </a>
    <a [routerLink]="['/o', officeId(), 'premiums']" routerLinkActive="active">
      {{ 'nav.premiums' | transloco }}
    </a>
    <a [routerLink]="['/o', officeId(), 'payrolls']" routerLinkActive="active">
      {{ 'payroll.listTitle' | transloco }}
    </a>
    <a [routerLink]="['/o', officeId(), 'bonuses']" routerLinkActive="active">
      {{ 'nav.bonuses' | transloco }}
    </a>
    <a [routerLink]="['/o', officeId(), 'settings']" routerLinkActive="active">
      {{ 'nav.settings' | transloco }}
    </a>
  </nav>

  <main class="shell-main">
    <router-outlet />
  </main>
</div>
