<div class="wrap">
    <ng-content />
    <button
      type="button"
      class="toggle"
      (click)="input()?.toggle()"
      [attr.aria-pressed]="input()?.visible()"
      [attr.aria-label]="(input()?.visible() ? 'auth.password.hide' : 'auth.password.show') | transloco"
    >
      @if (input()?.visible()) {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
          <circle cx="12" cy="12" r="3" />
          <path d="M3 3l18 18" />
        </svg>
      } @else {
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
          <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
          <circle cx="12" cy="12" r="3" />
        </svg>
      }
    </button>
  </div>
